<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Management Data Mahasiswa | Daftar Pengajuan Surat</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>Management Data Mahasiswa</h1>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../mahasiswa/list.html">Daftar Mahasiswa</a></li>

            </ul>
        </nav>

    <main>
        <section>
            <h2>Daftar Pengajuan Surat</h2>

            <div class="search-box">
                <label for="search-input">Cari Nama Surat</label>
                <input type="text" id="search-input" placeholder="Ketik nama surat...">
            </div>

            <p id="loading-indicator" style="display:none;">
                Memuat data...
            </p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Keperluan Surat</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="data-pengajuan">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Management Data Mahasiswa &mdash; Marcello Artasda</p>
