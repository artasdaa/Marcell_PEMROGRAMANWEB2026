<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Management Data Mahasiswa | Tambah Data</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Management Data Mahasiswa</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Mahasiswa</a></li>
                <li><a href="tambah.html">Tambah Mahasiswa</a></li>
                <li><a href="../anggota/list.html">Pengajuan Surat</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Data Mahasiswa</h2>
            <form>
                <p>
                    <label for="judul">Nama</label><br>
                    <input type="text" id="judul" name="judul" required>
                </p>
                <p>
                    <label for="pengarang">NIM</label><br>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>
                <p>
                    <label for="tahun">Tahun Masuk</label><br>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>
                <p>
                    <label for="isbn">Kelas</label><br>
                    <input type="text" id="isbn" name="isbn">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Management Data Mahasiswa &mdash; Marcello Artasda</p>
    </footer>
</body>
</html>
